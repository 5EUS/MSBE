# An example installer delivered as a sandboxed plan step extension. It is built for
# wasm32-unknown-unknown by scripts/development/build-wasm-extensions.sh, outside the main workspace.
[package]
name         = "msbe-step-option-installer"
description  = "The option-installer format: an example plan step extension that runs in MSBE's WebAssembly sandbox."
version      = "1.0.0"
edition      = "2024"
rust-version = "1.91"
license      = "MPL-2.0"
publish      = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
msbe-step-guest = { path = "../../../crates/msbe-step-guest" }
serde           = { version = "1.0.229", features = ["derive"] }
serde_json      = "1.0.151"

[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
panic         = "abort"
strip         = true
debug         = false

# Its own workspace: it targets wasm32 and is not part of the host build.
[workspace]
