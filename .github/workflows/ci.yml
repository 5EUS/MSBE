name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_XMLDOC_MODE: skip

jobs:
  # Cheap, fails fast, and catches most PRs before the matrix spends any time.
  lint:
    name: Lint and guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Architecture guards
        run: sh scripts/development/check-architecture.sh
      - name: XAML guards
        run: sh scripts/development/check-xaml.sh
      - name: Typos
        uses: crate-ci/typos@master

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.0"
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.0"
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-features --locked
      - name: Test
        run: cargo test --workspace --all-features --locked

  # NativeAOT cannot cross-compile, so each RID needs its own runner. A build that
  # is green on `dotnet build` can still fail at AOT publish, which is why publish
  # runs here rather than only at release.
  dotnet:
    name: .NET ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,   rid: linux-x64 }
          - { runner: ubuntu-24.04-arm, rid: linux-arm64 }
          - { runner: windows-latest,  rid: win-x64 }
          - { runner: windows-11-arm,  rid: win-arm64 }
          - { runner: macos-13,        rid: osx-x64 }
          - { runner: macos-latest,    rid: osx-arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: dotnet/global.json
      - name: Restore (locked)
        run: dotnet restore dotnet/MSBE.slnx --locked-mode
      - name: Verify formatting
        run: dotnet format whitespace dotnet/MSBE.slnx --no-restore --verify-no-changes
      - name: Build
        run: dotnet build dotnet/MSBE.slnx -c Release --no-restore
      - name: Test
        run: dotnet test dotnet/MSBE.slnx -c Release --no-build --collect:"XPlat Code Coverage" --results-directory artifacts/test-results
      - name: Publish NativeAOT
        run: dotnet publish dotnet/src/MSBE.Desktop/MSBE.Desktop.csproj -c Release -r ${{ matrix.rid }} --self-contained
      - name: Vulnerable packages
        run: dotnet list dotnet/MSBE.slnx package --vulnerable --include-transitive
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.rid }}
          path: artifacts/test-results
          if-no-files-found: warn
