# cargo-deny. Run by CI on every PR; install with `cargo install cargo-deny`.

[graph]
all-features = true
targets = [
  "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",   "aarch64-pc-windows-msvc",
  "x86_64-apple-darwin",      "aarch64-apple-darwin",
]

[advisories]
version = 2
ignore  = []          # every entry here needs a dated comment and an owner

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
  "MPL-2.0", "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards         = "deny"
deny = [
  { name = "openssl",     reason = "use rustls: fewer native dependencies and a far easier six-platform CI matrix" },
  { name = "openssl-sys", reason = "see openssl" },
  { name = "time",        reason = "use jiff or chrono; time 0.1 has known soundness issues", wrappers = [] },
]

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
