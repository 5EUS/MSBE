[package]
name        = "msbe-cli"
description = "The msbe command-line interface."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
readme.workspace       = true
keywords.workspace     = true
categories.workspace   = true
publish.workspace      = true

[lints]
workspace = true

# The crate is msbe-cli; the binary users type is `msbe`.
[[bin]]
name = "msbe"
path = "src/main.rs"

[dependencies]
clap.workspace       = true
msbe-core            = { version = "0.0.0", path = "../msbe-core" }
msbe-archive         = { version = "0.0.0", path = "../msbe-archive" }
msbe-fsops           = { version = "0.0.0", path = "../msbe-fsops" }
msbe-http            = { version = "0.0.0", path = "../msbe-http" }
msbe-plan-schema     = { version = "0.0.0", path = "../msbe-plan-schema" }
msbe-pack            = { version = "0.0.0", path = "../msbe-pack" }
msbe-provider-api    = { version = "0.0.0", path = "../msbe-provider-api" }
msbe-providers       = { version = "0.0.0", path = "../msbe-providers" }
msbe-rpc-schema      = { version = "0.0.0", path = "../msbe-rpc-schema" }
serde.workspace      = true
serde_json.workspace = true
tempfile.workspace   = true
thiserror.workspace  = true
toml.workspace       = true

[dev-dependencies]
msbe-provider-modrinth = { version = "0.0.0", path = "../msbe-provider-modrinth", features = ["test"] }
sha2.workspace = true
zip.workspace  = true
