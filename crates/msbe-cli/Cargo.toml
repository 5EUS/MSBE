[package]
name        = "msbe-cli"
description = "The msbe command-line interface."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
readme.workspace       = true
keywords.workspace     = true
categories.workspace   = true
publish.workspace      = true

[lints]
workspace = true

# The crate is msbe-cli; the binary users type is `msbe`.
[[bin]]
name = "msbe"
path = "src/main.rs"

[dependencies]
clap.workspace       = true
msbe-core            = { path = "../msbe-core" }
msbe-fsops           = { path = "../msbe-fsops" }
msbe-http            = { path = "../msbe-http" }
msbe-plan-schema     = { path = "../msbe-plan-schema" }
msbe-providers       = { path = "../msbe-providers" }
msbe-rpc-schema      = { path = "../msbe-rpc-schema" }
serde.workspace      = true
serde_json.workspace = true
tempfile.workspace   = true
thiserror.workspace  = true

[dev-dependencies]
sha2.workspace = true
zip.workspace  = true
