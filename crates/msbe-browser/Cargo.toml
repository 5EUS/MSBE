[package]
name         = "msbe-browser"
description  = "Isolated browser host process: shows provider pages and captures their links and downloads for the daemon."
version      = "0.0.0"
edition      = "2024"
rust-version = "1.91"
license      = "MPL-2.0"
repository   = "https://github.com/msbe/msbe"
homepage     = "https://github.com/msbe/msbe"
readme       = "../../README.md"
keywords     = ["modding", "games", "package-manager"]
categories   = ["games", "command-line-utilities", "filesystem"]
publish      = false

# Not a member of the MSBE workspace, which excludes it: CEF's build script downloads a Chromium
# distribution and needs cmake and ninja, so the browser is built as its own artifact.
# `cargo check --features dox` type-checks it against CEF's bindings without either.
[workspace]

[features]
dox = ["cef/dox"]

[dependencies]
cef                  = { version = "=152.2.0", default-features = false, features = ["sandbox"] }
getrandom            = "0.4.3"
msbe-browser-channel = { version = "0.0.0", path = "../msbe-browser-channel" }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", default-features = false, features = ["std", "stdio"] }

# The workspace's lints, copied, since this crate is not a member.
[lints.rust]
unsafe_code                   = "deny"
missing_docs                  = "deny"
missing_debug_implementations = "deny"
unreachable_pub               = "deny"
unused_qualifications         = "deny"
unused_import_braces          = "deny"
trivial_casts                 = "deny"
trivial_numeric_casts         = "deny"
let_underscore_drop           = "deny"
non_ascii_idents              = "deny"
rust_2018_idioms              = { level = "deny", priority = -1 }
future_incompatible           = { level = "deny", priority = -1 }
nonstandard_style             = { level = "deny", priority = -1 }

[lints.clippy]
all      = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo    = { level = "deny", priority = -1 }

# Noise from the groups above, turned off deliberately rather than case by case.
multiple_crate_versions = "allow"
must_use_candidate      = "allow"
module_name_repetitions = "allow"

# Panic discipline. This crate family writes into directories users cannot
# afford to lose; a panic mid-deploy is a half-applied transaction.
unwrap_used      = "deny"
expect_used      = "deny"
panic            = "deny"
todo             = "deny"
unimplemented    = "deny"
indexing_slicing = "deny"
integer_division = "deny"
float_cmp        = "deny"
string_slice     = "deny"

# Hygiene.
dbg_macro                       = "deny"
print_stdout                    = "deny"
print_stderr                    = "deny"
exit                            = "deny"
mem_forget                      = "deny"
str_to_string                   = "deny"
self_named_module_files         = "deny"
undocumented_unsafe_blocks      = "deny"
allow_attributes                = "deny"
allow_attributes_without_reason = "deny"
