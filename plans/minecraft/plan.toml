# Minecraft with modern mod loaders.
#
# Mods are .jar files placed flat into the loader's mods directory. Pack-declared resource and
# shader ZIP files are retained whole and routed to their respective Minecraft directories.

schema  = 1
id      = "minecraft"
name    = "Minecraft"
version = "0.1.0"

[[loaders]]
id        = "fabric"
bootstrap = "mc.fabric-installer"
sides     = ["client", "server"]
targets   = [
  { name = "mods", path = "mods" },
  { name = "resourcepacks", path = "resourcepacks" },
  { name = "shaderpacks", path = "shaderpacks" },
  { name = "datapacks", path = "datapacks" },
]

[[loaders]]
id        = "quilt"
# A loader fork: Quilt targets accept Fabric mods.
provides  = ["fabric"]
bootstrap = "mc.quilt-installer"
sides     = ["client", "server"]
targets   = [
  { name = "mods", path = "mods" },
  { name = "resourcepacks", path = "resourcepacks" },
  { name = "shaderpacks", path = "shaderpacks" },
  { name = "datapacks", path = "datapacks" },
]

[[loaders]]
id        = "neoforge"
bootstrap = "mc.neoforge-installer"
sides     = ["client", "server"]
targets   = [
  { name = "mods", path = "mods" },
  { name = "resourcepacks", path = "resourcepacks" },
  { name = "shaderpacks", path = "shaderpacks" },
  { name = "datapacks", path = "datapacks" },
]

[[steps]]
type = "extract"

  [steps.with]
  allow   = ["**/*.jar", "resourcepacks/**/*.zip", "shaderpacks/**/*.zip"]
  hygiene = "default"

[[steps]]
type = "place"

  [steps.with]
  into    = "@loader.targets.mods"
  include = ["**/*.jar"]
  flatten = true

[[steps]]
type = "place"

  [steps.with]
  into          = "@loader.targets.resourcepacks"
  include       = ["resourcepacks/**/*.zip"]
  strip_prefix  = "resourcepacks"
  flatten       = true

[[steps]]
type = "place"

  [steps.with]
  into          = "@loader.targets.shaderpacks"
  include       = ["shaderpacks/**/*.zip"]
  strip_prefix  = "shaderpacks"
  flatten       = true
