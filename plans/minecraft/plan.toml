# Minecraft.
#
# Modern loaders (Fabric, Quilt, NeoForge): mods are .jar files placed flat into the loader's mods
# directory, and pack-declared resource and shader ZIP files are routed whole to their Minecraft
# directories. Mid-era Forge uses the same mod directory plus an explicit coremods source
# directory for ASM transformers and a mutable config directory for .cfg files.
#
# Legacy jarmods (before 1.6): the `jarmod` loader builds a separate launcher version,
# `versions/<game version>-msbe`, from the vanilla client jar and version manifest, which are only
# read. Every jarmod's files are injected into the jar in profile order, so a later jarmod wins a
# class two of them replace, and `META-INF/` is dropped so the client's signature check does not
# reject the result. The manifest gets the new id and loses its client download, so the official
# launcher neither rejects the version nor downloads a vanilla jar over it.

schema  = 1
id      = "minecraft"
name    = "Minecraft"
version = "0.2.0"

[[loaders]]
id        = "fabric"
bootstrap = "mc.fabric-installer"
sides     = ["client", "server"]
targets   = [
  { name = "mods", path = "mods" },
  { name = "resourcepacks", path = "resourcepacks" },
  { name = "shaderpacks", path = "shaderpacks" },
  { name = "datapacks", path = "datapacks" },
]

[[loaders]]
id        = "quilt"
# A loader fork: Quilt targets accept Fabric mods.
provides  = ["fabric"]
bootstrap = "mc.quilt-installer"
sides     = ["client", "server"]
targets   = [
  { name = "mods", path = "mods" },
  { name = "resourcepacks", path = "resourcepacks" },
  { name = "shaderpacks", path = "shaderpacks" },
  { name = "datapacks", path = "datapacks" },
]

[[loaders]]
id        = "neoforge"
bootstrap = "mc.neoforge-installer"
sides     = ["client", "server"]
targets   = [
  { name = "mods", path = "mods" },
  { name = "resourcepacks", path = "resourcepacks" },
  { name = "shaderpacks", path = "shaderpacks" },
  { name = "datapacks", path = "datapacks" },
]

[[loaders]]
id        = "forge"
bootstrap = "none"
sides     = ["client", "server"]
targets   = [
  { name = "mods", path = "mods" },
  { name = "coremods", path = "coremods" },
  { name = "config", path = "config" },
]

[[loaders]]
id        = "jarmod"
bootstrap = "none"
sides     = ["client"]

# Modern loaders.

[[steps]]
type = "extract"

  [steps.with]
  loaders = ["fabric", "quilt", "neoforge"]
  allow   = ["**/*.jar", "resourcepacks/**/*.zip", "shaderpacks/**/*.zip"]
  hygiene = "default"

[[steps]]
type = "place"

  [steps.with]
  loaders = ["fabric", "quilt", "neoforge"]
  into    = "@loader.targets.mods"
  include = ["**/*.jar"]
  flatten = true

[[steps]]
type = "place"

  [steps.with]
  loaders       = ["fabric", "quilt", "neoforge"]
  into          = "@loader.targets.resourcepacks"
  include       = ["resourcepacks/**/*.zip"]
  strip_prefix  = "resourcepacks"
  flatten       = true

[[steps]]
type = "place"

  [steps.with]
  loaders       = ["fabric", "quilt", "neoforge"]
  into          = "@loader.targets.shaderpacks"
  include       = ["shaderpacks/**/*.zip"]
  strip_prefix  = "shaderpacks"
  flatten       = true

# Mid-era Forge. Coremods are intentionally explicit: an artifact must package an ASM
# transformer beneath coremods/ before MSBE routes it to Forge's coremod directory.

[[steps]]
type = "extract"

  [steps.with]
  loaders = ["forge"]
  allow   = ["**/*.jar", "config/**/*.cfg"]
  hygiene = "default"

[[steps]]
type = "place"

  [steps.with]
  loaders = ["forge"]
  into    = "@loader.targets.mods"
  include = ["**/*.jar"]
  exclude = ["coremods/**"]
  flatten = true

[[steps]]
type = "place"

  [steps.with]
  loaders      = ["forge"]
  into         = "@loader.targets.coremods"
  include      = ["coremods/**/*.jar"]
  strip_prefix = "coremods"
  flatten      = true

[[steps]]
type = "place"

  [steps.with]
  loaders      = ["forge"]
  into         = "@loader.targets.config"
  include      = ["config/**/*.cfg"]
  strip_prefix = "config"
  flatten      = false

[deploy]
mutable = ["@loader.targets.config/**"]

# Legacy jarmods.

[[steps]]
type = "extract"

  [steps.with]
  loaders = ["jarmod"]
  hygiene = "default"

[[steps]]
type = "inject"

  [steps.with]
  loaders = ["jarmod"]
  base    = "versions/{game_version}/{game_version}.jar"
  into    = "versions/{game_version}-msbe/{game_version}-msbe.jar"
  remove  = ["META-INF/**"]

[[steps]]
type = "edit-json"

  [steps.with]
  loaders = ["jarmod"]
  base    = "versions/{game_version}/{game_version}.json"
  into    = "versions/{game_version}-msbe/{game_version}-msbe.json"
  set     = { "/id" = "{game_version}-msbe" }
  remove  = ["/downloads/client"]
