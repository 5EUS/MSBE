# No Man's Sky.
#
# Local archives and files only: each mod input is placed beneath GAMEDATA/MODS with its
# source path intact. This includes generated .pak files and AMUMSS Lua, EXML, MBIN, and
# asset source trees. Documentation and AMUMSS status text stay in the store but are not
# deployed. Acquisition and the optional pak-check component are deferred.

schema  = 1
id      = "nomanssky"
name    = "No Man's Sky"
version = "0.1.0"

[[loaders]]
id        = "none"
bootstrap = "none"
sides     = ["client"]
targets   = [{ name = "mods", path = "GAMEDATA/MODS" }]

[[steps]]
type = "extract"

  [steps.with]
  hygiene    = "default"
  quarantine = ["**/*.txt", "**/*.md", "**/*.markdown"]

[[steps]]
type = "place"

  [steps.with]
  into    = "@loader.targets.mods"
  flatten = false
